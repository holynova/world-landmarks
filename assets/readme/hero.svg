<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">世界景点 · 纸上旅行 World Landmarks — 60 幅纸纹平涂风景与地标插画：西班牙、中国、日本、美国、韩国</title>
  <desc id="desc">暖纸底编辑风标题：世界景点 · 纸上旅行；右侧是五张平涂小卡，分别画着长城、鸟居、圣家堂尖塔、自由女神像与韩式宫殿屋顶。</desc>

  <rect width="1200" height="360" rx="26" fill="#f5efe4"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#4f5f58">水粉插画画廊 · GOUACHE ILLUSTRATION GALLERY</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1f3a34">世界景点 · 纸上旅行</text>
    <text x="56" y="168" font-size="23" fill="#2a2620">WORLD LANDMARKS — 60 幅纸纹平涂风景与地标插画</text>
    <text x="56" y="204" font-size="19" fill="#4f5f58">五国地标各 10 张，加海岸夏日与多样风景各 5 张。</text>
    <g id="chips" font-size="18" fill="#2a2620" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8cfba" stroke-width="1.5"/><text x="119" y="262">60 幅插画</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8cfba" stroke-width="1.5"/><text x="257" y="262">5 国地标</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8cfba" stroke-width="1.5"/><text x="395" y="262">7 个合集</text></g>
      <g><rect x="470" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8cfba" stroke-width="1.5"/><text x="533" y="262">高清下载</text></g>
    </g>
  </g>

  <g id="landmark-cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- china: great wall -->
    <g id="card-china">
      <rect x="684" y="56" width="88" height="180" rx="10" fill="#d8e8d8"/>
      <g>
        <path d="M684 190 Q728 150 772 190 L772 236 L684 236 Z" fill="#7a9a6a"/>
        <path d="M684 205 Q728 170 772 205 L772 236 L684 236 Z" fill="#5d7f52"/>
        <path d="M690 168 L710 156 L730 166 L752 152 L766 160" stroke="#8a7a5a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="716" y="146" width="14" height="18" fill="#8a7a5a"/>
        <rect x="713" y="142" width="20" height="6" fill="#6a5a3a"/>
        <circle cx="752" cy="84" r="10" fill="#e8c97a"/>
      </g>
      <text x="728" y="264" font-size="18" fill="#2a2620" text-anchor="middle">中国</text>
      <text x="728" y="290" font-size="18" fill="#4f5f58" text-anchor="middle">10 张</text>
    </g>
    <!-- japan: torii -->
    <g id="card-japan">
      <rect x="784" y="56" width="88" height="180" rx="10" fill="#f2d8d0"/>
      <g>
        <circle cx="828" cy="96" r="22" fill="#e8e0d0"/>
        <rect x="806" y="110" width="8" height="90" fill="#b03030"/>
        <rect x="842" y="110" width="8" height="90" fill="#b03030"/>
        <rect x="798" y="100" width="60" height="10" rx="3" fill="#b03030"/>
        <rect x="804" y="118" width="48" height="7" rx="3" fill="#b03030"/>
        <rect x="796" y="200" width="64" height="8" fill="#8a6a5a"/>
        <path d="M784 236 L872 236 L872 220 Q828 206 784 220 Z" fill="#7a9a8a"/>
      </g>
      <text x="828" y="264" font-size="18" fill="#2a2620" text-anchor="middle">日本</text>
      <text x="828" y="290" font-size="18" fill="#4f5f58" text-anchor="middle">10 张</text>
    </g>
    <!-- spain: sagrada spires -->
    <g id="card-spain">
      <rect x="884" y="56" width="88" height="180" rx="10" fill="#f5e3c8"/>
      <g>
        <polygon points="906,200 912,110 918,200" fill="#a8845a"/>
        <polygon points="922,200 928,88 934,200" fill="#8a6a42"/>
        <polygon points="938,200 944,116 950,200" fill="#a8845a"/>
        <circle cx="928" cy="82" r="5" fill="#c9a86a"/>
        <rect x="898" y="200" width="60" height="36" fill="#7a6a4a"/>
        <rect x="912" y="212" width="10" height="24" fill="#f5e3c8"/>
        <rect x="934" y="212" width="10" height="24" fill="#f5e3c8"/>
      </g>
      <text x="928" y="264" font-size="18" fill="#2a2620" text-anchor="middle">西班牙</text>
      <text x="928" y="290" font-size="18" fill="#4f5f58" text-anchor="middle">10 张</text>
    </g>
    <!-- usa: statue of liberty -->
    <g id="card-usa">
      <rect x="984" y="56" width="88" height="180" rx="10" fill="#d0dcea"/>
      <g>
        <polygon points="1028,210 1016,150 1040,150" fill="#5a8a7a"/>
        <circle cx="1028" cy="138" r="10" fill="#5a8a7a"/>
        <path d="M1018 132 L1014 122 M1028 128 L1028 116 M1038 132 L1042 122" stroke="#5a8a7a" stroke-width="3" stroke-linecap="round"/>
        <rect x="1038" y="128" width="5" height="30" fill="#5a8a7a" transform="rotate(24 1040 143)"/>
        <circle cx="1048" cy="122" r="6" fill="#e8c97a"/>
        <rect x="1004" y="210" width="48" height="26" fill="#8a8a8a"/>
      </g>
      <text x="1028" y="264" font-size="18" fill="#2a2620" text-anchor="middle">美国</text>
      <text x="1028" y="290" font-size="18" fill="#4f5f58" text-anchor="middle">10 张</text>
    </g>
    <!-- korea: palace roof -->
    <g id="card-korea">
      <rect x="1084" y="56" width="88" height="180" rx="10" fill="#e0d8ec"/>
      <g>
        <path d="M1092 132 Q1128 108 1164 132 L1160 144 Q1128 124 1096 144 Z" fill="#3a5a8a"/>
        <path d="M1096 144 Q1128 126 1160 144 L1156 152 Q1128 136 1100 152 Z" fill="#2a4a7a"/>
        <rect x="1104" y="152" width="8" height="56" fill="#8a5a3a"/>
        <rect x="1140" y="152" width="8" height="56" fill="#8a5a3a"/>
        <rect x="1112" y="168" width="28" height="40" fill="#c9b896"/>
        <rect x="1096" y="208" width="64" height="8" fill="#8a8a8a"/>
        <circle cx="1148" cy="84" r="9" fill="#e8c97a"/>
      </g>
      <text x="1128" y="264" font-size="18" fill="#2a2620" text-anchor="middle">韩国</text>
      <text x="1128" y="290" font-size="18" fill="#4f5f58" text-anchor="middle">10 张</text>
    </g>
  </g>
</svg>
